
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Online Tools</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  text-align: center;
  margin: 0;
  padding: 30px;
}
h1 { color: #174ea6; }
.tools {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  max-width: 900px;
  margin: 30px auto;
}
.tool {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #ddd;
}
</style>
</head>
<body>
<h1>Smart Online Tools</h1>
<p>Free and Easy Online Tools for Everyone</p>
<div class="tools">
  <div class="tool">Percentage Calculator</div>
  <div class="tool">Age Calculator</div>
  <div class="tool">Word Counter</div>
  <div class="tool">Discount Calculator</div>
  <div class="tool">Marks Calculator</div>
</div>
</body>
</html>
